version: 2
updates:
  # One root lockfile covers all npm workspaces (apps/*, packages/*)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch non-breaking updates into a single PR; majors still get their own PRs
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
