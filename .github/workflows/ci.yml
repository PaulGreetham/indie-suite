name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on critical advisories in production dependencies. Raise to high once the
      # firebase-admin@14 and puppeteer-core@25 major upgrades land.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint apps
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build apps
        run: npm run build

  rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator runs on the JVM
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Test Firestore security rules
        run: npm run test:rules -w app
